name: Refresh profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-graphics.yml
      - scripts/profile_stats.py

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate repository charts
        run: python3 scripts/profile_stats.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/contribution-snake.svg?palette=github-dark&color_snake=#7df9c1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/repository-stats.svg assets/contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile graphics"
          git pull --rebase origin main
          git push origin HEAD:main
